# ============================================================
# Sahay Backend — application-example.properties
# Production Render deployment reference template.
# Copy to application.properties and fill in real values,
# or supply all values as environment variables on Render.
# ============================================================

# --- Database (MongoDB Atlas) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hvhn}

# --- Server (Render sets PORT automatically) ---
server.port=${PORT:8080}

# --- Embedded Mongo exclusion ---
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

# --- JWT ---
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-min-32-chars}
app.jwt.expiration-ms=86400000

# --- CORS ---
# Production: CORS_ALLOWED_ORIGINS=https://projecthvhn.web.app
# Local dev:  http://localhost:5173,http://127.0.0.1:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Gemini Developer API (Google AI Studio) ---
# Obtain from: https://aistudio.google.com/app/apikey
# No Vertex AI billing, no service-account, no project-id needed.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# gemini-embedding-2 is compatible with the Developer API embedContent endpoint.
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# --- Firebase ---
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.auth.retry-attempts=${FIREBASE_AUTH_RETRY_ATTEMPTS:2}
firebase.auth.retry-delay-ms=${FIREBASE_AUTH_RETRY_DELAY_MS:250}

# --- Email: Mailjet HTTPS API (no SMTP, Render-compatible) ---
# Render Free blocks SMTP ports 25/465/587. Use Mailjet API instead.
app.mailjet.api-key=${MAILJET_API_KEY:}
app.mailjet.api-secret=${MAILJET_API_SECRET:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Sahay}

# --- OTP ---
app.otp.expiry-seconds=300
app.otp.resend-cooldown-seconds=30
app.otp.rate-window-seconds=3600
app.otp.max-requests-per-window=5

# --- Cloudinary (chat file uploads — no local disk, Render ephemeral filesystem safe) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- ML Intelligence ---
ml.enabled=${ML_ENABLED:true}
ml.service-url=${ML_SERVICE_URL:http://localhost:8001}
# Production: https://<your-ai-service>.onrender.com
# 90 seconds to allow for Render Free cold-start.
ml.request-timeout-seconds=${ML_REQUEST_TIMEOUT_SECONDS:90}
ml.volunteer-top-k=${ML_VOLUNTEER_TOP_K:20}
