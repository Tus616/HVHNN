spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hvhn}
server.port=${PORT:8080}
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

gemini.project-id=${GEMINI_PROJECT_ID:hvhn-project}
gemini.location=${GEMINI_LOCATION:us-central1}
gemini.model=${GEMINI_MODEL:gemini-1.5-pro}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
gemini.service-account.path=${GEMINI_SERVICE_ACCOUNT_PATH:}

firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.auth.retry-attempts=${FIREBASE_AUTH_RETRY_ATTEMPTS:2}
firebase.auth.retry-delay-ms=${FIREBASE_AUTH_RETRY_DELAY_MS:250}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}

app.chat.upload-dir=${CHAT_UPLOAD_DIR:uploads/chat}

ml.enabled=${ML_ENABLED:true}
ml.service-url=${ML_SERVICE_URL:http://localhost:8001}
ml.request-timeout-seconds=${ML_REQUEST_TIMEOUT_SECONDS:3}
ml.volunteer-top-k=${ML_VOLUNTEER_TOP_K:20}
