# HVHN Backend Configuration
server.port=8080

# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=hvhn
spring.data.mongodb.auto-index-creation=false
de.flapdoodle.mongodb.embedded.version=6.0.2

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000

# JWT Secret
app.jwt.secret=hvhn-super-secret-key-2026-hyperlocal-verified-help-network
app.jwt.expiration-ms=86400000

# Firebase
firebase.service-account.path=classpath:firebase/serviceAccountKey.json
firebase.auth.retry-attempts=2
firebase.auth.retry-delay-ms=250

# Logging
logging.level.com.hvhn.backend=INFO

# OTP verification
# app.otp.expiry-seconds=300
# app.otp.verification-window-seconds=900
# app.otp.resend-cooldown-seconds=30
app.otp.debug-return-otp=false
# app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Optional SMTP setup for real OTP email delivery.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_MAIL_USERNAME}
spring.mail.password=${APP_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM}

# Chat uploads
app.chat.upload-dir=uploads/chat
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allow circular references to resolve HelpRequestService <-> VolunteerService cycle
spring.main.allow-circular-references=true

# Gemini AI Configuration
gemini.project-id=${GEMINI_PROJECT_ID}
gemini.location=us-central1
gemini.model=gemini-2.0-flash
gemini.embedding-model=text-embedding-004
gemini.service-account.path=classpath:Vertex-Api.json

