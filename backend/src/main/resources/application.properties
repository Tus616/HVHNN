# ============================================================
# Sahay Backend — application.properties
# ============================================================
# Secrets must be provided via environment variables in production.
# Defaults here are ONLY safe for local development.
# ============================================================

# --- Database ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hvhn}

# --- Server ---
server.port=${PORT:8080}

# --- Embedded Mongo (excluded — always use real Atlas in production) ---
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

# --- Security & CORS ---
app.jwt.secret=${JWT_SECRET:dev-only-change-me-change-me-change-me-32chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:3000}

# --- Gemini Developer API (Google AI Studio) ---
# No Vertex AI, no service-account, no project-id required.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# gemini-embedding-2 is compatible with the Developer API embedContent endpoint.
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# --- Firebase ---
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.auth.retry-attempts=${FIREBASE_AUTH_RETRY_ATTEMPTS:2}
firebase.auth.retry-delay-ms=${FIREBASE_AUTH_RETRY_DELAY_MS:250}

# --- Email (Mailjet HTTPS API — no SMTP) ---
app.mailjet.api-key=${MAILJET_API_KEY:}
app.mailjet.api-secret=${MAILJET_API_SECRET:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Sahay}

# --- OTP ---
app.otp.expiry-seconds=300
app.otp.resend-cooldown-seconds=30
app.otp.rate-window-seconds=3600
app.otp.max-requests-per-window=5

# --- Cloudinary (chat file uploads) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- ML Intelligence (optional) ---
ml.enabled=${ML_ENABLED:true}
ml.service-url=${ML_SERVICE_URL:http://localhost:8001}
# 90 seconds to allow for Render Free cold-start on the AI service.
ml.request-timeout-seconds=${ML_REQUEST_TIMEOUT_SECONDS:90}
ml.volunteer-top-k=${ML_VOLUNTEER_TOP_K:20}
